    <!-- Synchronous early theme, appearance & motion initialization to eliminate flash of unstyled theme -->
    <script>
      (function() {
        try {
          var savedAppearance = localStorage.getItem('maulik_appearance_pref');
          var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          if (savedAppearance === 'light' || (!savedAppearance && prefersLight)) {
            document.documentElement.setAttribute('data-appearance', 'light');
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.setAttribute('data-appearance', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          }
          var savedTheme = localStorage.getItem('maulik_theme_pref');
          if (savedTheme === 'amber' || savedTheme === 'midnight' || savedTheme === 'obsidian') {
            document.documentElement.setAttribute('data-theme', savedTheme);
          }
          var savedMotion = localStorage.getItem('maulik_motion_pref');
          var prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (prefersReduced || savedMotion === 'reduced') {
            document.documentElement.setAttribute('data-reduced-motion', 'true');
          }
        } catch (e) {}
      })();
    </script>
